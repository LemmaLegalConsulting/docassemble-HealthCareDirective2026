---
include:
- docassemble.AssemblyLine:assembly_line.yml
- docassemble.LawHelpMNBranding:theme.yml
---
metadata:
  title: Minnesota health care directive
  short title: Health care directive
  description: |
    Choose a health care agent, write health care instructions, or both.
  can_I_use_this_form: |
    This form is for an adult making a Minnesota health care directive.
  before_you_start: |
    Have the names and contact information for any agents you want to choose.
    Think about the care you would want if you could not speak for yourself.
  when_you_are_finished: |
    Review and print your directive. Complete the signing and witness or notary
    sections before sharing signed copies with your agents and health care providers.
  authors:
  - Amanda Sauber
  - Lemma Legal Consulting
  jurisdiction: NAM-US-US+MN
  LIST_topics:
  - HE-00-00-00-00
  original_form:
  - https://www.revisor.mn.gov/statutes/cite/145C.16
  maturity: testing
  unlisted: true
  requires_notarization: false
  languages:
  - en
  help_page_url: https://www.lawhelpmn.org/self-help-library/fact-sheet/health-care-directives
  help_page_title: Health Care Directives
---
code: |
  AL_DEFAULT_COUNTRY = "US"
  AL_DEFAULT_STATE = "MN"
  al_form_type = "other_form"
  user_role = "na"
  user_ask_role = "na"
  github_repo_name = "docassemble-HealthCareDirective2026"
  signature_fields = []
---
template: interview_short_title
content: |
  Make a Minnesota health care directive
---
objects:
- users: ALPeopleList.using(there_are_any=True, target_number=1)
- primary_agent: ALIndividual
- alternate_agent: ALIndividual
---
sections:
- about_you: About you
- agents: Your agents
- instructions: Your wishes
- review_health_care_directive_2026: Review and download
---
mandatory: true
code: |
  al_intro_screen
  health_care_directive_2026_intro
  nav.set_section("about_you")
  users[0].name.first
  users[0].birthdate
  users[0].address.address
  directive_choices
  if directive_choices["agent"]:
    nav.set_section("agents")
    primary_agent.name.first
    primary_agent.relationship
    primary_agent.address.address
    appoint_alternate_agent
    if appoint_alternate_agent:
      alternate_agent.name.first
      alternate_agent.relationship
      alternate_agent.address.address
    limits_on_powers
  if directive_choices["instructions"]:
    nav.set_section("instructions")
    # Define before the screens because validation code cannot look up undefined variables.
    instruction_variables
    health_care_goals
    beliefs_about_quality_of_life
    temporary_incapacity_wishes
    dependent_care_wishes
    preferred_doctor
    organ_donation_wishes
    if not directive_choices["agent"] and not any(str(value(name)).strip() for name in instruction_variables):
      force_ask("organ_donation_wishes")
  nav.set_section("review_health_care_directive_2026")
  health_care_directive_2026_download
---
code: |
  instruction_variables = ["health_care_goals", "health_care_fears", "spiritual_beliefs", "beliefs_about_quality_of_life", "thoughts_about_family", "pregnancy_care_wishes", "temporary_incapacity_wishes", "dying_care_wishes", "permanent_unconsciousness_wishes", "dependent_care_wishes", "pain_relief_wishes", "preferred_doctor", "preferred_care_location", "preferred_dying_location", "organ_donation_wishes", "body_disposition_wishes", "other_health_care_wishes"]
---
id: directive introduction
continue button field: health_care_directive_2026_intro
question: |
  Make a Minnesota health care directive
subquestion: |
  You can choose someone to make health care decisions for you, write down your
  wishes, or do both.

  You will print the document and sign it with witnesses or a notary.
  This interview does not collect electronic signatures.

  Read [Health Care Directives](https://www.lawhelpmn.org/self-help-library/fact-sheet/health-care-directives) on LawHelpMN for more information.
---
id: directive choices
question: |
  What do you want your directive to include?
fields:
- Choose one or both: directive_choices
  datatype: checkboxes
  choices:
  - A health care agent to make decisions for me: agent
  - Instructions about the health care I want: instructions
  minlength: 1
  none of the above: false
---
id: primary agent name
sets:
- primary_agent.name.first
- primary_agent.name.middle
- primary_agent.name.last
question: |
  Who do you want as your health care agent?
subquestion: |
  Choose someone you trust to follow your wishes. Talk with this person before
  you sign your directive.
fields:
- code: primary_agent.name_fields()
---
id: primary agent contact
question: |
  Tell us about ${ primary_agent }
fields:
- Relationship to you: primary_agent.relationship
- Phone number (optional): primary_agent.phone_number
  required: false
---
id: primary agent address
sets:
- primary_agent.address.address
- primary_agent.address.city
- primary_agent.address.state
- primary_agent.address.zip
question: |
  What is ${ primary_agent }'s address?
fields:
- code: primary_agent.address_fields()
---
id: alternate agent choice
question: |
  Do you want to choose an alternate agent?
subquestion: |
  An alternate can act if your first agent is not available.
fields:
- Choose an alternate agent: appoint_alternate_agent
  datatype: yesnoradio
---
id: alternate agent name
sets:
- alternate_agent.name.first
- alternate_agent.name.middle
- alternate_agent.name.last
question: |
  Who do you want as your alternate agent?
fields:
- code: alternate_agent.name_fields()
---
id: alternate agent contact
question: |
  Tell us about ${ alternate_agent }
fields:
- Relationship to you: alternate_agent.relationship
- Phone number (optional): alternate_agent.phone_number
  required: false
---
id: alternate agent address
sets:
- alternate_agent.address.address
- alternate_agent.address.city
- alternate_agent.address.state
- alternate_agent.address.zip
question: |
  What is ${ alternate_agent }'s address?
fields:
- code: alternate_agent.address_fields()
---
id: agent powers
question: |
  Do you want to limit what your agent can decide?
subquestion: |
  Your directive lists the decisions your agent can make. You can limit
  those decisions or give your agent instructions. You can leave both boxes blank.

  The printed form also lists 2 extra powers. To give your agent those
  powers, initial the lines next to them when you sign.
fields:
- Limits on my agent's powers (optional): limits_on_powers
  datatype: area
  required: false
- Other instructions for my agent (optional): comments_on_agents_powers
  datatype: area
  required: false
---
id: beliefs and values
question: |
  What matters to you about your health care?
subquestion: |
  You may leave any answer blank. Your answers will be included in your directive.
fields:
- My goals for my health care: health_care_goals
  datatype: area
  required: false
- My fears about my health care: health_care_fears
  datatype: area
  required: false
- My spiritual or religious beliefs: spiritual_beliefs
  datatype: area
  required: false
---
id: quality of life
question: |
  How might your health affect your life and family?
subquestion: |
  You may leave any answer blank. Your answers will be included in your directive.
fields:
- My beliefs about when life would no longer be worth living: beliefs_about_quality_of_life
  datatype: area
  required: false
- My thoughts about how my condition might affect my family: thoughts_about_family
  datatype: area
  required: false
- My wishes about care during pregnancy, if this applies to me: pregnancy_care_wishes
  datatype: area
  required: false
---
id: treatment wishes
question: |
  What care would you want in these situations?
subquestion: |
  You may leave any answer blank. Your answers will be included in your directive.
fields:
- If I had a reasonable chance of recovery: temporary_incapacity_wishes
  datatype: area
  required: false
- If I were dying: dying_care_wishes
  datatype: area
  required: false
- If I were permanently unconscious: permanent_unconsciousness_wishes
  datatype: area
  required: false
---
id: dependence and pain relief
question: |
  What are your wishes about long-term care and pain relief?
subquestion: |
  You may leave any answer blank. Your answers will be included in your directive.
fields:
- If I were completely dependent on others: dependent_care_wishes
  datatype: area
  required: false
- My wishes about pain relief and its effects: pain_relief_wishes
  datatype: area
  required: false
---
id: other care wishes
question: |
  What else do you want people to know?
subquestion: |
  You may leave any answer blank. Your answers will be included in your directive.
fields:
- Who I would like as my health care provider: preferred_doctor
  datatype: area
  required: false
- Where I would like to receive care: preferred_care_location
  datatype: area
  required: false
- Where I would like to die and other wishes about dying: preferred_dying_location
  datatype: area
  required: false
---
id: after death wishes
question: |
  What are your wishes after death?
subquestion: |
  You may leave any answer blank. Your answers will be included in your directive.
fields:
- My wishes about donating organs or other body parts: organ_donation_wishes
  datatype: area
  required: false
- My wishes about burial, cremation, or other arrangements: body_disposition_wishes
  datatype: area
  required: false
- Any other health care wishes: other_health_care_wishes
  datatype: area
  required: false
validation code: |
  if not directive_choices["agent"] and not any(str(value(name)).strip() for name in instruction_variables):
    validation_error("Write at least one health care instruction, or go back and choose an agent.", field="other_health_care_wishes")
---
id: directive review
event: review_health_care_directive_2026
question: |
  Review your answers
review:
- Edit: users[0].name.first
  button: |
    **Name:** ${ users[0] }
- Edit: users[0].birthdate
  button: |
    **Date of birth:** ${ users[0].birthdate }
- Edit: users[0].address.address
  button: |
    **Address:** ${ users[0].address.on_one_line() }
- Edit: directive_choices
  button: |
    **What to include:** ${ comma_and_list((["a health care agent"] if directive_choices["agent"] else []) + (["health care instructions"] if directive_choices["instructions"] else [])) }
- Edit: primary_agent.name.first
  show if: directive_choices['agent']
  button: |
    **Agent:** ${ showifdef('primary_agent') }
- Edit: primary_agent.relationship
  show if: directive_choices['agent']
  button: |
    **Agent's relationship to you:** ${ showifdef('primary_agent.relationship') }
- Edit: primary_agent.address.address
  show if: directive_choices['agent']
  button: |
    **Agent's address:** ${ primary_agent.address.on_one_line() if defined('primary_agent.address.address') else '' }
- Edit: appoint_alternate_agent
  show if: directive_choices['agent']
  button: |
    Choose or remove an alternate agent

    **Alternate agent chosen:** ${ yesno(appoint_alternate_agent) if defined('appoint_alternate_agent') else '' }
- Edit: alternate_agent.name.first
  show if: directive_choices['agent'] and appoint_alternate_agent
  button: |
    **Alternate agent:** ${ showifdef('alternate_agent') }
- Edit: alternate_agent.relationship
  show if: directive_choices['agent'] and appoint_alternate_agent
  button: |
    **Alternate agent's relationship to you:** ${ showifdef('alternate_agent.relationship') }
- Edit: alternate_agent.address.address
  show if: directive_choices['agent'] and appoint_alternate_agent
  button: |
    **Alternate agent's address:** ${ alternate_agent.address.on_one_line() if defined('alternate_agent.address.address') else '' }
- Edit: limits_on_powers
  show if: directive_choices['agent']
  button: |
    Limits and instructions about agent powers
- Edit: health_care_goals
  show if: directive_choices['instructions']
  button: |
    Your goals, fears, and beliefs
- Edit: beliefs_about_quality_of_life
  show if: directive_choices['instructions']
  button: |
    Your wishes about quality of life and family
- Edit: temporary_incapacity_wishes
  show if: directive_choices['instructions']
  button: |
    Your treatment wishes
- Edit: dependent_care_wishes
  show if: directive_choices['instructions']
  button: |
    Your wishes about long-term care and pain relief
- Edit: preferred_doctor
  show if: directive_choices['instructions']
  button: |
    Your wishes about doctors and where you get care
- Edit: organ_donation_wishes
  show if: directive_choices['instructions']
  button: |
    Your wishes after death
---
id: download health care directive
event: health_care_directive_2026_download
question: |
  Review and print your directive
subquestion: |
  Your directive is ready. Check every page before you sign it.

  ${ action_button_html(url_action('review_health_care_directive_2026'), label='Edit answers', color='info') }

  ${ al_user_bundle.download_list_html() }

  Your directive is not valid until you sign it. Sign and date it in front
  of 2 witnesses or a notary. Read the instructions for who can be a witness.

  Learn more: [Health Care Directives](https://www.lawhelpmn.org/self-help-library/fact-sheet/health-care-directives) on LawHelpMN.
progress: 100
---
objects:
- health_care_directive_2026_Post_interview_instructions: ALDocument.using(title="Instructions", filename="health_care_directive_2026_next_steps.docx",
    enabled=True, has_addendum=False)
- health_care_directive_2026_attachment: ALDocument.using(title="Health care directive", filename="health_care_directive_2026",
    enabled=True, has_addendum=False, )
---
objects:
- al_user_bundle: ALDocumentBundle.using(elements=[health_care_directive_2026_Post_interview_instructions,
    health_care_directive_2026_attachment], filename="health_care_directive_2026", title="All forms to
    download for your records", enabled=True)
- al_recipient_bundle: ALDocumentBundle.using(elements=[health_care_directive_2026_attachment],  filename="health_care_directive_2026",
    title="All forms to file", enabled=True)
---
attachment:
  name: Post-interview-Instructions
  filename: health_care_directive_2026_next_steps
  docx template file: health_care_directive_2026_next_steps.docx
  variable name: health_care_directive_2026_Post_interview_instructions[i]
  tagged pdf: true
---
attachment:
  name: health care directive 2026
  filename: health_care_directive_2026
  variable name: health_care_directive_2026_attachment[i]
  docx template file: health_care_directive_2026.docx
  tagged pdf: true
